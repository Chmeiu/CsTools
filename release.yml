name: Build and publish CsTools release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate release tag matches application version
        shell: pwsh
        run: |
          $version = python -c "from version import APP_VERSION; print(APP_VERSION)"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match version.py (v$version)."
          }

      - name: Build installer
        shell: pwsh
        run: .\build_release.ps1

      - name: Generate installer checksum
        shell: pwsh
        run: |
          $installer = 'release\installer\Instalar_CsTools.exe'
          if (-not (Test-Path -LiteralPath $installer)) { throw "Installer not found: $installer" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          "$hash  Instalar_CsTools.exe" | Set-Content -LiteralPath 'release\installer\Instalar_CsTools.exe.sha256' -Encoding ascii

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: CsTools ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/installer/Instalar_CsTools.exe
            release/installer/Instalar_CsTools.exe.sha256
